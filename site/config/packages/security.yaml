security:
    role_hierarchy:
        ROLE_ADMIN: ROLE_USER
        ROLE_SUPER_ADMIN: [ROLE_ADMIN, ROLE_USER]

    password_hashers:
        App\Entity\User:
            algorithm: auto
            # Passwords of the legacy (FOSUserBundle) system are verified with the legacy hasher and
            # replaced with a modern hash on the first successful login (see UserRepository::upgradePassword()).
            migrate_from:
                - legacy_sha512
        legacy_sha512:
            algorithm: sha512
            encode_as_base64: true
            iterations: 5000

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            form_login:
                login_path: admin_login
                check_path: admin_login_check
                enable_csrf: true
                success_handler: App\Security\AjaxAuthenticationHandler
                failure_handler: App\Security\AjaxAuthenticationHandler
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
            login_throttling:
                max_attempts: 5
                interval: '1 minute'
            logout:
                path: admin_logout
                target: admin_login

    access_control:
        - { path: ^/admin/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design; in tests a low cost is fine.
            App\Entity\User:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
                migrate_from:
                    - legacy_sha512
