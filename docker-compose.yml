name: ${PROJECT_NAME}

services:
  nginx:
    image: nginx:1.31.8-alpine
    container_name: ${PROJECT_NAME}-nginx
    depends_on:
      - php
    ports:
      - "127.0.0.1:${HTTP_PORT}:80"
    volumes:
      - ./site:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      # Always fetch the newest php:8.5 patch release when the image is rebuilt.
      pull: true
    container_name: ${PROJECT_NAME}-php
    working_dir: /var/www/html
    environment:
      TZ: ${TZ}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./site:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro
    networks:
      - app

  mysql:
    image: mysql:8.0.46
    container_name: ${PROJECT_NAME}-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ}
    ports:
      - "127.0.0.1:${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks:
      - app

  phpmyadmin:
    image: phpmyadmin:5.2.3
    container_name: ${PROJECT_NAME}-phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      UPLOAD_LIMIT: ${PHPMYADMIN_UPLOAD_LIMIT}
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT}:80"
    networks:
      - app

volumes:
  mysql_data:

networks:
  app:
    driver: bridge
