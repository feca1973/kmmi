name: ${PROJECT_NAME}-backend

services:
  nginx:
    image: nginx:1.27.4-alpine
    container_name: ${PROJECT_NAME}-backend-nginx
    depends_on:
      - php
    ports:
      - "${BACKEND_HTTP_PORT}:80"
    volumes:
      - ./site:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - backend

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ${PROJECT_NAME}-backend-php
    working_dir: /var/www/html
    environment:
      APP_ENV: ${BACKEND_APP_ENV}
      TZ: ${BACKEND_TZ}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_started
    volumes:
      - ./site:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro
    networks:
      - backend

  mysql:
    image: mysql:8.4.8
    container_name: ${PROJECT_NAME}-backend-mysql
    restart: unless-stopped
    command: --port=${MYSQL_INTERNAL_PORT}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${BACKEND_TZ}
    ports:
      - "${MYSQL_PORT}:${MYSQL_INTERNAL_PORT}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --port=${MYSQL_INTERNAL_PORT} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  redis:
    image: redis:8.4.0
    container_name: ${PROJECT_NAME}-backend-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.11
    container_name: ${PROJECT_NAME}-backend-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ELASTICSEARCH_JAVA_OPTS}
    ports:
      - "${ELASTICSEARCH_PORT}:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    networks:
      - backend

  phpmyadmin:
    image: phpmyadmin:5.2.2
    container_name: ${PROJECT_NAME}-backend-phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: ${MYSQL_INTERNAL_PORT}
#      PMA_USER: ${MYSQL_USER}
#      PMA_PASSWORD: ${MYSQL_PASSWORD}
      UPLOAD_LIMIT: ${PHPMYADMIN_UPLOAD_LIMIT}
    ports:
      - "${PHPMYADMIN_PORT}:80"
    networks:
      - backend

volumes:
  mysql_data:
  redis_data:
  elastic_data:

networks:
  backend:
    driver: bridge
