server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;
    client_max_body_size 50M;

    # Uploaded files are served as plain static files; PHP is never executed here.
    location ^~ /uploads/ {
        location ~* \.(php|phtml|phar)$ {
            return 404;
        }

        # DEV ONLY (this file is the dev environment's nginx): the uploaded files of the live site are not here, a
        # missing file is read from the live site. The production vhost must not have this fallback.
        try_files $uri @live_uploads;
    }

    location @live_uploads {
        proxy_pass https://kmmi.org.ua;
        proxy_ssl_server_name on;
        proxy_set_header Host kmmi.org.ua;
    }

    # The file manager connector takes uploads of up to 60 MB (attachments); the limits are raised only here.
    location ^~ /admin/efconnect/ {
        client_max_body_size 64M;
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PHP_VALUE "upload_max_filesize=64M\npost_max_size=70M";
        fastcgi_read_timeout 300;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
        internal;
    }

    # Any other .php file is not an entry point.
    location ~ \.php$ {
        return 404;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri /index.php$is_args$args;
    }
}
